/* Utilidades compartidas por las 11 escenas (se copian a cada proyecto con scripts/sync-scenes.mjs).
 * Todo es determinista: sin relojes, sin azar, sin red. */
(function () {
  const APV = window.APV;

  /** Datos de una escena: textos de copy.json, duración y tiempos de palabras de timing.json. */
  APV.scene = function (id) {
    const copy = APV.copy.scenes.find((s) => s.id === id);
    const t = APV.timing.scenes.find((s) => s.id === id);
    const words = t.words || [];
    return {
      copy,
      pantalla: copy.pantalla,
      dur: t.durationFrames / APV.fps, // duración de la escena (sin colchón)
      voStart: t.voStartFrames / APV.fps,
      words,
      /** Segundo (relativo a la escena) en que la locución dice `word` (n-ésima aparición). Sin timing, usa `fallback`. */
      at(word, fallback = 0, nth = 0) {
        const norm = (s) => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9$]/g, "");
        const hits = words.filter((w) => norm(w.w) === norm(word));
        return hits[nth] ? hits[nth].t : fallback;
      },
    };
  };

  /** Envuelve cada palabra de `el` en <span class="w"><span class="wi">…</span></span> para entradas por palabra. */
  APV.splitWords = function (el) {
    const text = el.textContent.trim();
    el.textContent = "";
    text.split(/\s+/).forEach((word, i, all) => {
      const outer = document.createElement("span");
      outer.className = "w";
      const inner = document.createElement("span");
      inner.className = "wi";
      inner.textContent = word;
      outer.appendChild(inner);
      el.appendChild(outer);
      if (i < all.length - 1) el.appendChild(document.createTextNode(" "));
    });
    return el.querySelectorAll(".wi");
  };

  /** Prepara trazos SVG para dibujarse (stroke-dasharray = longitud). Devuelve los nodos. */
  APV.prepStroke = function (selector, root = document) {
    const nodes = Array.from(root.querySelectorAll(selector));
    nodes.forEach((p) => {
      const len = Math.ceil(p.getTotalLength ? p.getTotalLength() : 1000) + 2;
      p.style.strokeDasharray = `${len}`;
      p.style.strokeDashoffset = `${len}`;
      p.dataset.len = String(len);
    });
    return nodes;
  };

  /** Tween que dibuja trazos preparados con prepStroke. */
  APV.draw = function (tl, nodes, at, duration = 0.8, stagger = 0.06) {
    tl.to(nodes, { strokeDashoffset: 0, duration, ease: "power2.inOut", stagger }, at);
  };

  /** Contador determinista: escribe el valor entero en `el` mientras avanza. */
  APV.counter = function (tl, el, from, to, at, duration, format = (v) => String(v)) {
    const state = { v: from };
    el.textContent = format(from);
    tl.to(state, { v: to, duration, ease: "power1.out", onUpdate: () => (el.textContent = format(Math.round(state.v))) }, at);

    <!-- /apv:data -->
    <script>
      const S = APV.scene("escena-09");
      const P = S.pantalla;
      const D = S.dur;
      const END = D - 0.2; // todo termina antes de aquí
      const C = APV.brand.colors;
      // tiempo sincronizado con la voz, recortado para que la animación (len) acabe antes de END
      const beat = (word, frac, len) => Math.max(0, Math.min(S.at(word, D * frac), END - len));

      // ---- Textos (copy.json) ----
      const l1 = document.getElementById("l1");
      l1.textContent = P.linea1;
      const w1 = APV.splitWords(l1);
      const l2 = document.getElementById("l2");
      l2.textContent = P.linea2;
      const w2 = APV.splitWords(l2);

      // ---- Auto lineal + zona de daño ----
      const CAR_W = 640, K = CAR_W / 440;
      const DMG = { cx: 62, cy: 96, r: 38 }; // frontal (el morro va a la izquierda)
      const carbox = document.getElementById("carbox");
      carbox.insertAdjacentHTML("beforeend", APV.carSVG({ kind: "sedan", width: CAR_W }));
      let hatch = "";
      for (let x = -10; x <= 130; x += 12) hatch += `<path class="hatch" d="M${x} ${DMG.cy + 46} L${x + 50} ${DMG.cy - 46}"/>`;
      carbox.insertAdjacentHTML(
        "beforeend",
        `<svg width="${CAR_W}" height="${(CAR_W * 150) / 440}" viewBox="0 0 440 150" fill="none" stroke-linecap="round">
          <defs>
            <clipPath id="dmgClip"><circle cx="${DMG.cx}" cy="${DMG.cy}" r="${DMG.r - 6}"/></clipPath>
            <mask id="dmgMask" maskUnits="userSpaceOnUse" x="0" y="0" width="440" height="150">
              <circle class="dmask" cx="${DMG.cx}" cy="${DMG.cy}" r="${DMG.r}" stroke="#fff" stroke-width="14" transform="rotate(-90 ${DMG.cx} ${DMG.cy})"/>
            </mask>
          </defs>
          <g clip-path="url(#dmgClip)" stroke="${C.accent}" stroke-width="3" opacity="0.6">${hatch}</g>
          <circle cx="${DMG.cx}" cy="${DMG.cy}" r="${DMG.r}" stroke="${C.accent}" stroke-width="4.5" stroke-dasharray="9 8" mask="url(#dmgMask)"/>
        </svg>`
      );
      // Lupa (icono de trazo) centrada sobre la zona de daño
      const MAG = Math.round(((DMG.r + 12) * K * 24) / 6.5);
      carbox.insertAdjacentHTML("beforeend", APV.icon("search", { size: MAG, width: 1.25, cls: "mag" }));
      const mag = carbox.querySelector(".mag");
      mag.style.left = `${DMG.cx * K - (10.5 / 24) * MAG}px`;
      mag.style.top = `${DMG.cy * K - (10.5 / 24) * MAG}px`;

      // Documento del título (icono de trazo) en la esquina de la tarjeta
      document.getElementById("card").insertAdjacentHTML("beforeend", APV.icon("doc", { size: 110, width: 1.5, cls: "doc" }));

      // ---- Lista de comprobación ----
      const list = document.getElementById("list");
      P.lista.forEach((txt) => {
        const row = document.createElement("div");
        row.className = "row";
        row.innerHTML = `<svg class="box" width="64" height="64" viewBox="0 0 64 64" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="58" height="58" rx="14" stroke="${C.line}" stroke-width="4" fill="${C.white}"/>
            <path class="tick" d="M17 33 L28 44 L48 21" stroke="${C.accent}" stroke-width="7"/>
          </svg><span class="t"></span>`;
        row.querySelector(".t").textContent = txt;
        list.appendChild(row);
      });
      const rows = list.querySelectorAll(".row");

      const carStrokes = APV.prepStroke("#carbox .car .stroke");
      const hatches = APV.prepStroke("#carbox .hatch");
      const dmask = APV.prepStroke("#carbox .dmask");
      const arrow = APV.prepStroke(".arw");
      const docStrokes = APV.prepStroke("#card .doc path");
      const ticks = Array.from(list.querySelectorAll(".tick"));
      APV.prepStroke(".tick", list);

      // ---- Tiempos (proporcionales a S.dur si no hay timing de palabras) ----
      const tDano = beat("daño", 0.16, 1.0);
      const tTit = beat("título", 0.29, 0.8);
      const tRev = beat("revisamos", 0.5, 0.9);
      const tChecks = [beat("cada", 0.62, 0.9), beat("contigo", 0.72, 0.6), beat("pujar", 0.84, 0.35)];
      // garantiza orden y separación mínima entre checks
      for (let i = 1; i < 3; i++) tChecks[i] = Math.max(tChecks[i], tChecks[i - 1] + 0.3);

      const tl = gsap.timeline({ paused: true });
      tl.fromTo(w1, { yPercent: 110 }, { yPercent: 0, duration: 0.55, ease: "power3.out", stagger: 0.07 }, 0.05);
      tl.fromTo("#card", { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power2.out" }, 0.2);
      tl.fromTo(".car-hub", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, 0.8);
      APV.draw(tl, carStrokes, 0.3, 0.8, 0.04);
      // zona de daño: círculo discontinuo que se dibuja + rayado
      tl.to(dmask, { strokeDashoffset: 0, duration: 0.6, ease: "power2.inOut" }, tDano);
      tl.to(hatches, { strokeDashoffset: 0, duration: 0.3, ease: "power1.out", stagger: 0.03 }, tDano + 0.25);
      // «título»: se traza el documento del título
      APV.draw(tl, docStrokes, tTit, 0.6, 0.08);
      // transición: flecha + «lo revisamos contigo»
      APV.draw(tl, arrow, tRev, 0.35, 0.1);
      tl.fromTo(w2, { yPercent: 110 }, { yPercent: 0, duration: 0.5, ease: "power3.out", stagger: 0.07 }, tRev + 0.15);
      // la lupa llega y se posa sobre el daño
      tl.fromTo(mag, { opacity: 0, x: 200, y: 120 }, { opacity: 1, x: 0, y: 0, duration: 0.75, ease: "power3.out" }, tRev + 0.05);
      // filas de la lista y checks que se trazan uno a uno
      tl.fromTo(rows, { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out", stagger: 0.1 }, tRev + 0.3);
      ticks.forEach((t, i) => tl.to(t, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, Math.min(tChecks[i], END - 0.35)));
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
